<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servidor Zepli</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Menú Superior -->
    <header class="menu-superior">
        <div class="etiqueta-nombre">Servidor Zepli</div>
    </header>

    <!-- Conexión General -->
    <section class="seccion-conexion">
        <div class="caja-conexion">
            <input type="text" id="idGeneral" placeholder="Tu Identificador Principal">
            <button id="btnConectarGeneral">Conectar</button>
            <div id="estadoGeneral" class="estado">Desconectado</div>
        </div>
    </section>

    <!-- Lista de Canales -->
    <main class="contenedor-canales" id="contenedorCanales">
        <h2>Canales</h2>
        <div id="listaCanales">
            <!-- Los 20 canales se generan automáticamente -->
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
